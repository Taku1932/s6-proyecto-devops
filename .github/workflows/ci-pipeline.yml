name: CI-CD Portal de Documentos

# Eventos que activan el pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-cd:
    name: Integracion continua y despliegue simulado
    runs-on: ubuntu-latest

    steps:
      # Descargar el codigo del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Preparar las variables de entorno
      - name: Configurar entorno
        run: cp .env.example .env

      # Validar la infraestructura declarativa
      - name: Validar Docker Compose
        run: docker compose config

      # Construir las imagenes de los servicios
      - name: Build de imagenes Docker
        run: docker compose build

      # Ejecutar las pruebas automatizadas
      - name: Ejecutar pruebas con pytest
        run: docker compose run --rm api python -m pytest tests/ -v

      # Desplegar en un entorno temporal controlado
      - name: Despliegue simulado
        run: docker compose up -d --wait --wait-timeout 120

      # Comprobar el estado de los contenedores
      - name: Verificar estado de los servicios
        run: docker compose ps

      # Validar los endpoints mediante Nginx
      - name: Verificar disponibilidad de la aplicacion
        run: |
          curl --fail --show-error http://localhost:8080/health
          curl --fail --show-error http://localhost:8080/api/documentos

      # Comprobar la comunicacion interna
      - name: Validar comunicacion entre contenedores
        run: |
          docker compose exec -T frontend wget -qO- http://api:5000/health

      # Obtener registros de ejecucion
      - name: Revisar logs de los servicios
        if: always()
        run: docker compose logs --no-color

      # Liberar los recursos del entorno simulado
      - name: Detener servicios
        if: always()
        run: docker compose down