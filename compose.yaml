
services:

  # Servicio backend desarrollado con Python Flask
  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    image: documentos-api:1.0

    environment:
      APP_NAME: "${APP_NAME:-Portal de Documentos Administrativos}"
      APP_ENV: "${APP_ENV:-development}"

    expose:
      - "5000"

    networks:
      - documentos-network

    restart: unless-stopped

    # Verificacion del estado de la API
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Servicio frontend con Nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    image: documentos-frontend:1.0

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    networks:
      - documentos-network

    # Iniciar cuando la API se encuentre operativa
    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

    # Verificacion del frontend y conexion con la API
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Red propia para la comunicacion entre servicios
networks:
  documentos-network:
    driver: bridge
